name: Deploy SecAgent website

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-secagent-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 159.195.70.108
      DEPLOY_PORT: "22"
      DEPLOY_USER: root
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Verify and build site
        env:
          VITEPRESS_BASE: /
        run: |
          npm ci --ignore-scripts
          npm run docs:build
          test -f docs/.vitepress/dist/index.html

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload and activate immutable release
        run: |
          release_path="/opt/secagent-website/releases/${GITHUB_SHA}"
          ssh_cmd="ssh -i ~/.ssh/id_ed25519 -p $DEPLOY_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -o root -g root -m 0755 '$release_path' /opt/secagent-website/deploy"
          rsync -az --delete --chmod=D755,F644 \
            -e "$ssh_cmd" \
            docs/.vitepress/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$release_path/"
          rsync -az --delete --chmod=D755,F755 \
            -e "$ssh_cmd" \
            deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/secagent-website/deploy/"
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/secagent-website/deploy/activate-release.sh '$release_path'"

      - name: Verify site from server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:45372/ | grep -q 'SecAgent'"
