# nginx 配置：SecAgent 官网静态站点（服务器 159.195.70.108）
#
# 部署方式：将本文件复制到服务器 /etc/nginx/conf.d/secagent-website.conf
# （或 sites-available/ 后软链到 sites-enabled/），然后 `nginx -t && systemctl reload nginx`。
# 站点根目录 /var/www/secagent-website 由 .github/workflows/deploy-server.yml
# 在每次 push 到 master 后 rsync 更新。

server {
    listen 45372;
    listen [::]:45372;
    server_name _;

    root /var/www/secagent-website;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-hashed build assets never change under the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # VitePress cleanUrls: resolve extensionless paths to their .html builds.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
